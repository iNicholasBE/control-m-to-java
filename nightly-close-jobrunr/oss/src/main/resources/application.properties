spring.application.name=nightly-close-jobrunr-oss
server.port=8181

spring.datasource.url=jdbc:postgresql://localhost:5440/nightly_jobrunr?reWriteBatchedInserts=true
spring.datasource.username=nightly
spring.datasource.password=nightly
# 20 workers, each may hold a connection, plus JobRunr's own housekeeping and the HTTP endpoints.
spring.datasource.hikari.maximum-pool-size=30

jobrunr.background-job-server.enabled=true
# Fixed, like the Control-M agent's resource pool of 20 database connections.
jobrunr.background-job-server.worker-count=20
# The minimum JobRunr allows; it bounds the join poller and recurring trigger latency.
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8001
jobrunr.jobs.default-number-of-retries=10
jobrunr.miscellaneous.allow-anonymous-data-usage=false

# 22:00 UTC, Monday to Friday. Holidays are filtered inside the trigger. Set to "-" to disable.
nightly-close.trigger.cron=0 22 * * 1-5
nightly-close.regulator-url=http://localhost:${server.port}/regulator/submissions
