spring.application.name=nightly-close-jobrunr-pro
server.port=8182

spring.datasource.url=jdbc:postgresql://localhost:5440/nightly_jobrunr?reWriteBatchedInserts=true
spring.datasource.username=nightly
spring.datasource.password=nightly
spring.datasource.hikari.maximum-pool-size=30

jobrunr.background-job-server.enabled=true
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8002
jobrunr.jobs.default-number-of-retries=10
jobrunr.miscellaneous.allow-anonymous-data-usage=false

# [Pro] Workers: JobRunr learns the worker count from connection wait time, CPU and memory, instead of a fixed number.
# For the fixed-size comparison run: worker-capacity-policy=fixed-size and worker-count=20.
jobrunr.background-job-server.worker-capacity-policy=self-learning
# [Pro] Fetch jobs ahead in chunks so a worker that finishes picks up the next job without a database round trip.
jobrunr.background-job-server.work-distribution-strategy=prefetch-queue

# [Pro] The Control-M resource pool: at most 20 database-heavy jobs (scoring partitions, aggregate) at once.
jobrunr.jobs.rate-limiter.concurrent-job-rate-limiter.database-heavy=20

# [Pro] per-step: one job per Control-M job, chained. grouped: durable head and tail jobs around the scoring batch.
nightly-close.pro.chain-shape=per-step

# 22:00 UTC on business days (BusinessDaySchedule skips weekends and holidays.txt). Set to "-" to disable.
nightly-close.trigger.cron=0 22 * * *
nightly-close.regulator-url=http://localhost:${server.port}/regulator/submissions
