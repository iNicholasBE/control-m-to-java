[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctminv"
version = "0.1.0"
description = "Inventory a Control-M or Autosys estate before migrating batch to Java"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ctminv = "ctminv.cli:main"

[tool.setuptools]
packages = ["ctminv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
