# JobRunr Pro module. Needs JOBRUNR_REPO_USER / JOBRUNR_REPO_PASSWORD to build and JOBRUNR_PRO_LICENSE to run.
IMPL_FAMILY=jobrunr
RESULTS_DIR="$REPO/results/jobrunr"
DB_NAME=nightly_jobrunr
IMPL_BUILD="cd '$REPO/nightly-close-jobrunr' && mvn -q -B -s .mvn/jobrunr-pro-settings.xml -Ppro -DskipTests package -pl pro -am"
IMPL_JAR="$REPO/nightly-close-jobrunr/pro/target/nightly-close-jobrunr-pro.jar"
IMPL_PORT=8182

impl_args() {
  echo "--server.port=$1" \
       "--jobrunr.dashboard.port=$(( $1 - 180 ))" \
       "--spring.datasource.url=jdbc:postgresql://localhost:$PG_PORT/$DB_NAME?reWriteBatchedInserts=true" \
       "--nightly-close.trigger.cron=${TRIGGER_CRON:--}"
}
