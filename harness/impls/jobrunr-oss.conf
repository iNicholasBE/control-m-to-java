# JobRunr OSS module. Sourced by lib.sh.
IMPL_FAMILY=jobrunr
RESULTS_DIR="$REPO/results/jobrunr"
DB_NAME=nightly_jobrunr
IMPL_BUILD="cd '$REPO/nightly-close-jobrunr' && mvn -q -B -DskipTests package -pl oss -am"
IMPL_JAR="$REPO/nightly-close-jobrunr/oss/target/nightly-close-jobrunr-oss.jar"
IMPL_PORT=8181

# impl_args <http port>: everything the app needs besides its working directory.
impl_args() {
  echo "--server.port=$1" \
       "--jobrunr.dashboard.port=$(( $1 - 180 ))" \
       "--spring.datasource.url=jdbc:postgresql://localhost:$PG_PORT/$DB_NAME?reWriteBatchedInserts=true" \
       "--nightly-close.trigger.cron=${TRIGGER_CRON:--}"
}
