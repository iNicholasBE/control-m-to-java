# Spring Batch module. Written against the shared contract; the Spring Batch maintainers own the values below.
IMPL_FAMILY=springbatch
RESULTS_DIR="$REPO/results/springbatch"
DB_NAME=nightly_springbatch
IMPL_BUILD="cd '$REPO/nightly-close-spring-batch' && mvn -q -B -DskipTests package"
IMPL_JAR="$(ls "$REPO"/nightly-close-spring-batch/target/*.jar 2>/dev/null | grep -v original | head -1)"
IMPL_PORT=8183

impl_args() {
  printf '%s\n' "--server.port=$1" \
       "--spring.datasource.url=jdbc:postgresql://localhost:$PG_PORT/$DB_NAME?reWriteBatchedInserts=true" \
       "--nightly-close.trigger.cron=${TRIGGER_CRON:--}"
}
